[project]
name = "chronofresh-backend"
version = "0.1.0"
description = "Chrono-Fresh backend API"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "sqlalchemy",
    "psycopg2-binary",
    "python-multipart",
    "pillow",
    "pillow-heif",
    "alembic",
    "keras==3.15.0",
    "tensorflow-cpu>=2.20,<2.22",
    "numpy>=1.26",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "email-validator>=2.3.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
